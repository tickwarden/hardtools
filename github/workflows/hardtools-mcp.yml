# .github/workflows/hardtools-mcp.yml
name: hardtools MCP – Build, Publish & Lifecycle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Her gün 03:00 UTC – kullanılmayan instance’ları kontrol et
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_shutdown_idle:
        description: '90 günden eski idle instance’ları şimdi kapat'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write   # OIDC için (gerekirse)

env:
  NODE_VERSION: '20'
  IDLE_DAYS: 90

jobs:
  # ──────────────────────────────────────────────
  # 1. Test + Bundle
  # ──────────────────────────────────────────────
  test-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Bundle
        run: npm run bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: hardtools-bundle
          path: |
            bundle/
            package.json
            README.md
            LICENSE
            hardtools.config.example.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Publish (sadece tag’lerde)
  # ──────────────────────────────────────────────
  publish:
    needs: test-and-bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@vt
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Bundle
        run: npm run bundle

      - name: Publish to npm (optional)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true   # token yoksa sessizce geç

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bundle/index.js
            hardtools.config.example.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # 3. Idle sunucu temizliği (90 gün)
  # ──────────────────────────────────────────────
  cleanup-idle-servers:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.force_shutdown_idle == true
    steps:
      - name: Check for idle MCP HTTP instances
        env:
          # Bu değerleri kendi altyapına göre doldur
          # Örnek: Cloudflare, Fly.io, Railway, kendi VPS listesi vs.
          API_TOKEN: ${{ secrets.INFRA_API_TOKEN }}
          IDLE_THRESHOLD_DAYS: ${{ env.IDLE_DAYS }}
        run: |
          echo "🔍 ${IDLE_THRESHOLD_DAYS} günden uzun süredir istek almayan hardtools MCP instance’ları aranıyor..."

          # --- Örnek iskelet (kendi altyapına göre uyarlaman lazım) ---
          # 1. Tüm çalışan instance’ları listele
          # 2. Son istek zamanını (last_seen / last_request) al
          # 3. 90 günden eski olanları kapat / sil

          # Örnek (pseudo):
          # instances=$(curl -s -H "Authorization: Bearer $API_TOKEN" https://api.example.com/instances?label=hardtools-mcp)
          # echo "$instances" | jq -r '.[] | select(.last_request_at < now - ('$IDLE_THRESHOLD_DAYS' * 86400)) | .id' | while read id; do
          #   echo "🛑 Idle instance kapatılıyor: $id"
          #   curl -X DELETE -H "Authorization: Bearer $API_TOKEN" "https://api.example.com/instances/$id"
          # done

          echo "✅ Temizlik job’u tamamlandı (gerçek API çağrılarını kendi altyapına göre doldur)."

      - name: Notify (opsiyonel)
        if: failure()
        run: echo "Idle cleanup başarısız oldu – kontrol et."
