name: hardtools MCP – Build, Publish & Lifecycle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Her gün 03:00 UTC – kullanılmayan instance’ları kontrol et
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_shutdown_idle:
        description: '90 günden eski idle instance’ları şimdi kapat'
        type: boolean
        default: false
      unpublish_server:
        description: 'Çalışan MCP sunucusunu ve tüneli yayından kaldır'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  NODE_VERSION: '20'
  IDLE_DAYS: 90

jobs:
  # ──────────────────────────────────────────────
  # 1. Test + Bundle
  # ──────────────────────────────────────────────
  test-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --test --test-concurrency=1 test/*.test.mjs

      - name: Bundle
        run: npm run bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: hardtools-bundle
          path: |
            bundle/
            package.json
            README.md
            LICENSE
            hardtools.config.example.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Publish, Start Server & Cloudflared Tunnel
  # ──────────────────────────────────────────────
  publish:
    needs: test-and-bundle
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event.inputs.unpublish_server != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Bundle
        run: npm run bundle

      - name: Publish to npm (optional)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Terminate old processes, Start MCP HTTP Server & Cloudflared Tunnel
        run: |
          for p in /proc/[0-9]*; do 
            cmd=$(tr "\0" " " < "$p/cmdline" 2>/dev/null || true)
            echo "$cmd" | grep -q "bundle/index.js" && kill "$(basename "$p")" && echo "killed $(basename "$p")"
          done
          sleep 0.4
          
          if [ -f /tmp/ht-token ]; then
            export HARDTOOLS_HTTP_TOKEN="$(cat /tmp/ht-token)"
          else
            export HARDTOOLS_HTTP_TOKEN="default-dev-token"
          fi

          export HARDTOOLS_ALLOWED_HOSTS="*"
          export HARDTOOLS_HTTP_OPEN=1
          export HARDTOOLS_HTTP_ALLOW_LOCAL_TOOLS=1
          export HARDTOOLS_PROFILE=balanced
          export HARDTOOLS_ROOTS=/workspace
          export HARDTOOLS_CONFIG=/root/.hardtools/config.json
          
          mkdir -p /workspace/artifacts/hardtools_extract
          cd /workspace/artifacts/hardtools_extract || cd .
          
          node bundle/index.js --http --host 127.0.0.1 --port 8787 --profile balanced &

          if [ ! -f /tmp/cloudflared ]; then
            echo "📥 Cloudflared indiriliyor..."
            curl -L --output /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x /tmp/cloudflared
          fi

          echo "🌐 Cloudflared tüneli başlatılıyor..."
          /tmp/cloudflared tunnel --url http://127.0.0.1:8787 --no-autoupdate

  # ──────────────────────────────────────────────
  # 3. Yayından Kaldırma ve Temizlik (Unpublish / Shutdown)
  # ──────────────────────────────────────────────
  cleanup-idle-servers:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.force_shutdown_idle == true || inputs.unpublish_server == true
    steps:
      - name: Unpublish / Terminate Active MCP Processes
        run: |
          echo "🛑 Sunucu ve tünel yayından kaldırılıyor (Unpublish)..."
          
          # Çalışan bundle/index.js ve cloudflared süreçlerini bulup sonlandır
          for p in /proc/[0-9]*; do 
            cmd=$(tr "\0" " " < "$p/cmdline" 2>/dev/null || true)
            if echo "$cmd" | grep -qE "bundle/index.js|cloudflared"; then
              pid=$(basename "$p")
              kill "$pid" && echo "Kapatıldı (PID: $pid): $cmd"
            fi
          done

          echo "🔍 ${IDLE_DAYS} günden eski geçici önbellek kalıntıları temizleniyor..."
          find /tmp -name "ht-*" -mtime +${IDLE_DAYS} -exec rm -rf {} + 2>/dev/null || true
          
          echo "✅ Yayından kaldırma ve temizlik başarıyla tamamlandı."

      - name: Notify on failure
        if: failure()
        run: echo "Yayından kaldırma işlemi başarısız oldu – kontrol et."
