# AI-assisted: Bu dosya Claude (Anthropic) tarafından yeniden düzenlendi.
# Merge etmeden önce insan gözden geçirmesi gerekir (Legends11).
#
# Bu workflow hiçbir repo secret'ı veya variable'ı GEREKTİRMEZ.
#  - MCP token'ı her çalıştırmada rastgele üretilir.
#  - Tünel: Cloudflare quick tunnel (hesap/token gerekmez).
#  - npm: trusted publishing (OIDC), NPM_TOKEN yok.
#  - Public repoda token, SENİN age/SSH PUBLIC key'inle şifrelenip yazılır;
#    private repoda anahtar vermezsen düz yazı olarak özete yazılır.
name: hardtools MCP – Build, Publish & Serve

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Ne yapılsın?'
        type: choice
        options: [build-only, serve, unpublish]
        default: build-only
      age_recipient:
        description: 'serve: age (age1...) veya SSH PUBLIC key. Public repoda ZORUNLU; token bununla şifrelenir'
        type: string
        default: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIrsoGr+eE+h/e8k+VAtrJ9X6R9MFJEa/SaNmFr08FoX hardtools-serve'
      allow_local_tools:
        description: 'serve: HARDTOOLS_HTTP_ALLOW_LOCAL_TOOLS açılsın mı? (riskli)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  MCP_PORT: '8787'

jobs:
  # ──────────────────────────────────────────────
  # 1. Test + Bundle
  # ──────────────────────────────────────────────
  test-and-bundle:
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'unpublish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=1 test/*.test.mjs
      - run: npm run bundle

      - uses: actions/upload-artifact@v7
        with:
          name: hardtools-bundle
          path: |
            bundle/
            package.json
            README.md
            LICENSE
            hardtools.config.example.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. npm publish (sadece v* tag'i) – OIDC trusted publishing
  #    Tek seferlik kurulum npmjs.com'da yapılır (secret değil):
  #    Paket > Settings > Trusted Publisher > GitHub Actions
  #    (repo + bu workflow'un dosya adı)
  # ──────────────────────────────────────────────
  publish-npm:
    needs: test-and-bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'    # trusted publishing için npm >= 11.5.1 gerekir
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Tag ile package.json sürümü eşleşiyor mu?
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) != package.json ($pkg)"
            exit 1
          fi

      - run: npm ci
      - run: npm run bundle
      - run: npm publish --access public

  # ──────────────────────────────────────────────
  # 3. MCP sunucusu + quick tunnel (sadece elle: action = serve)
  #    Token + URL, age_recipient verilirse şifreli, verilmezse (sadece
  #    private repoda) düz yazı olarak job özetine yazılır.
  # ──────────────────────────────────────────────
  serve:
    needs: test-and-bundle
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'serve'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: hardtools-mcp-serve
      cancel-in-progress: true
    env:
      # cloudflared 2026.8.1 – linux-amd64 ham binary
      # (sha256: github.com/cloudflare/cloudflared/releases sayfasından)
      CLOUDFLARED_VERSION: '2026.8.1'
      CLOUDFLARED_SHA256: '98d8eadbfdf8c7ec994e08260599c9be991e7833c746f98692b18bdf71c9b9dc'
      REPO_PRIVATE: ${{ github.event.repository.private }}
      AGE_RECIPIENT: ${{ inputs.age_recipient }}
      ALLOW_LOCAL_TOOLS: ${{ inputs.allow_local_tools && '1' || '0' }}
    steps:
      - name: Token teslim yolunu doğrula
        run: |
          set -euo pipefail
          if [ -z "$AGE_RECIPIENT" ] && [ "$REPO_PRIVATE" != "true" ]; then
            echo "::error::Public repoda token düz yazı yazılamaz. age_recipient (PUBLIC key) ver veya repo'yu private yap."
            exit 1
          fi
          if [ -n "$AGE_RECIPIENT" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
            echo test | age -r "$AGE_RECIPIENT" -a >/dev/null \
              || { echo "::error::age_recipient geçersiz (age1... veya ssh PUBLIC key olmalı)"; exit 1; }
          fi

      - uses: actions/download-artifact@v7
        with:
          name: hardtools-bundle
          path: artifact

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start tunnel + MCP server
        run: |
          set -euo pipefail

          # --- cloudflared: sabit sürüm + checksum doğrulaması ---
          cf="$RUNNER_TEMP/cloudflared"
          curl -fsSL --retry 3 -o "$cf" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  $cf" | sha256sum -c -
          chmod +x "$cf"

          NODE_PID=""; CF_PID=""
          trap 'kill $NODE_PID $CF_PID 2>/dev/null || true' EXIT

          # --- Tüneli ÖNCE başlat: host adı, sunucuya ALLOWED_HOSTS olarak verilecek ---
          cf_log="$RUNNER_TEMP/cloudflared.log"
          "$cf" tunnel --no-autoupdate --url "http://127.0.0.1:${MCP_PORT}" >"$cf_log" 2>&1 &
          CF_PID=$!

          url=""
          for _ in $(seq 1 60); do
            url="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$cf_log" | head -n1 || true)"
            [ -n "$url" ] && break
            kill -0 "$CF_PID" 2>/dev/null || { cat "$cf_log"; echo "::error::cloudflared çöktü"; exit 1; }
            sleep 1
          done
          [ -n "$url" ] || { cat "$cf_log"; echo "::error::Tünel URL'si 60 sn içinde alınamadı"; exit 1; }
          host="${url#https://}"

          # --- Her çalıştırmada rastgele token ---
          token="$(openssl rand -hex 32)"

          # --- MCP sunucusu: repo yerine boş sandbox, host kısıtlı ---
          sandbox="$RUNNER_TEMP/hardtools-sandbox"
          mkdir -p "$sandbox"
          cd "$sandbox"

          export HARDTOOLS_HTTP_TOKEN="$token"
          # src/index.ts Host başlığını tam eşleştirir (port dahil). Public host + yerel host'lar.
          export HARDTOOLS_ALLOWED_HOSTS="$host,127.0.0.1:${MCP_PORT},localhost:${MCP_PORT}"
          export HARDTOOLS_HTTP_ALLOW_LOCAL_TOOLS="$ALLOW_LOCAL_TOOLS"
          export HARDTOOLS_PROFILE=balanced
          export HARDTOOLS_ROOTS="$sandbox"
          export HARDTOOLS_CONFIG="$GITHUB_WORKSPACE/artifact/hardtools.config.example.json"

          # Sunucu çıktısı log'a basılmaz (public repoda sızıntı riski).
          node "$GITHUB_WORKSPACE/artifact/bundle/index.js" \
            --http --host 127.0.0.1 --port "$MCP_PORT" --profile balanced \
            >"$RUNNER_TEMP/node.log" 2>&1 &
          NODE_PID=$!

          ready=0
          for _ in $(seq 1 30); do
            kill -0 "$NODE_PID" 2>/dev/null || { echo "::error::MCP sunucusu çöktü"; exit 1; }
            if (exec 3<>"/dev/tcp/127.0.0.1/$MCP_PORT") 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "::error::Sunucu 30 sn içinde hazır olmadı"; exit 1; }

          endpoint="$url/mcp"
          payload="$(printf 'ENDPOINT: %s\nAUTH: Authorization: Bearer %s\nLOCAL_TOOLS: %s' "$endpoint" "$token" "$ALLOW_LOCAL_TOOLS")"

          if [ -n "$AGE_RECIPIENT" ]; then
            {
              echo "### hardtools MCP yayında (şifreli)"
              echo "Aşağıdaki bloğu bir dosyaya kaydet ve çöz: \`age -d -i <özel_anahtar> dosya\`"
              echo '```'
              printf '%s\n' "$payload" | age -r "$AGE_RECIPIENT" -a
              echo '```'
              echo "Kapatmak için: bu workflow'u \`action = unpublish\` ile çalıştır."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### hardtools MCP yayında (private repo, düz yazı)"
              echo "- Endpoint: \`$endpoint\` (yalnızca POST)"
              echo "- Header: \`Authorization: Bearer $token\`"
              echo "- Local tools: \`$ALLOW_LOCAL_TOOLS\`"
              echo "- Kapatmak için: bu workflow'u \`action = unpublish\` ile çalıştır."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          # Biri ölürse (sunucu veya tünel) job biter; boşa yayında kalmaz.
          wait -n "$NODE_PID" "$CF_PID" || true
          echo "::warning::Sunucu veya tünel sonlandı, job kapanıyor."

  # ──────────────────────────────────────────────
  # 4. Yayından kaldır: çalışan serve run'ını iptal et
  # ──────────────────────────────────────────────
  unpublish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'unpublish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel running serve runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wf="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          ids="$(gh run list --workflow "$wf" --event workflow_dispatch \
                   --status in_progress --json databaseId --jq '.[].databaseId')"
          found=0
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh run cancel "$id" && echo "İptal edildi: run $id" && found=1
          done
          [ "$found" = 1 ] || echo "Çalışan serve run'ı bulunamadı."
