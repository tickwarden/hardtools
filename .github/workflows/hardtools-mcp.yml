name: hardtools MCP – Build, Publish & Lifecycle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Her gün 03:00 UTC – kullanılmayan instance’ları kontrol et
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_shutdown_idle:
        description: '90 günden eski idle instance’ları şimdi kapat'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  NODE_VERSION: '20'
  IDLE_DAYS: 90

jobs:
  # ──────────────────────────────────────────────
  # 1. Test + Bundle
  # ──────────────────────────────────────────────
  test-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --test --test-concurrency=1 test/*.test.mjs

      - name: Bundle
        run: npm run bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: hardtools-bundle
          path: |
            bundle/
            package.json
            README.md
            LICENSE
            hardtools.config.example.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. Publish, Start Server & Cloudflared Tunnel
  # ──────────────────────────────────────────────
  publish:
    needs: test-and-bundle
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Bundle
        run: npm run bundle

      - name: Publish to npm (optional)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Terminate old processes, Start MCP HTTP Server & Cloudflared Tunnel
        run: |
          for p in /proc/[0-9]*; do 
            cmd=$(tr "\0" " " < "$p/cmdline" 2>/dev/null || true)
            echo "$cmd" | grep -q "bundle/index.js" && kill "$(basename "$p")" && echo "killed $(basename "$p")"
          done
          sleep 0.4
          
          if [ -f /tmp/ht-token ]; then
            export HARDTOOLS_HTTP_TOKEN="$(cat /tmp/ht-token)"
          else
            export HARDTOOLS_HTTP_TOKEN="default-dev-token"
          fi

          export HARDTOOLS_ALLOWED_HOSTS="*"
          export HARDTOOLS_HTTP_OPEN=1
          export HARDTOOLS_HTTP_ALLOW_LOCAL_TOOLS=1
          export HARDTOOLS_PROFILE=balanced
          export HARDTOOLS_ROOTS=/workspace
          export HARDTOOLS_CONFIG=/root/.hardtools/config.json
          
          mkdir -p /workspace/artifacts/hardtools_extract
          cd /workspace/artifacts/hardtools_extract || cd .
          
          node bundle/index.js --http --host 127.0.0.1 --port 8787 --profile balanced &

          if [ ! -f /tmp/cloudflared ]; then
            echo "📥 Cloudflared indiriliyor..."
            curl -L --output /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x /tmp/cloudflared
          fi

          echo "🌐 Cloudflared tüneli başlatılıyor..."
          /tmp/cloudflared tunnel --url http://127.0.0.1:8787 --no-autoupdate

  # ──────────────────────────────────────────────
  # 3. Gerçek Idle Sunucu Temizliği (90 Gün)
  # ──────────────────────────────────────────────
  cleanup-idle-servers:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.force_shutdown_idle == true
    steps:
      - name: Real Shutdown of Idle MCP Instances
        env:
          INFRA_API_TOKEN: ${{ secrets.INFRA_API_TOKEN }}
          INFRA_API_ENDPOINT: ${{ secrets.INFRA_API_ENDPOINT }}
          IDLE_THRESHOLD_DAYS: ${{ env.IDLE_DAYS }}
        run: |
          echo "🔍 ${IDLE_THRESHOLD_DAYS} günden uzun süredir istek almayan instance'lar taranıyor ve kapatılıyor..."

          if [ -z "$INFRA_API_ENDPOINT" ] || [ -z "$INFRA_API_TOKEN" ]; then
            echo "❌ HATA: INFRA_API_ENDPOINT veya INFRA_API_TOKEN secrets tanımlanmamış!"
            exit 1
          fi

          # 1. Altyapı API'sinden aktif instance listesini JSON formatında çek
          response=$(curl -s -X GET "$INFRA_API_ENDPOINT" \
            -H "Authorization: Bearer $INFRA_API_TOKEN" \
            -H "Content-Type: application/json")

          # 2. jq kullanarak son aktivite tarihi 90 günden (IDLE_THRESHOLD_DAYS) eski olan instance ID'lerini filtrele
          # Not: JSON şemanıza göre '.instances[]' veya doğrudan kök dizi yapısını (.[] ile) uyarlayabilirsiniz.
          expired_instances=$(echo "$response" | jq -r --argjson days "$IDLE_THRESHOLD_DAYS" '
            if type=="array" then .[] else .instances[] end | 
            select(.idle_days > $days or .inactive_days > $days) | 
            .id
          ')

          if [ -z "$expired_instances" ]; then
            echo "✨ Kapatılması gereken idle (süresi dolmuş) instance bulunamadı."
            exit 0
          fi

          # 3. Tespit edilen her bir eski instance için gerçek kapatma (DELETE / Shutdown) isteği at
          for instance_id in $expired_instances; do
            echo "🛑 [GERÇEK KAPATMA] Süresi dolan instance sonlandırılıyor: $instance_id"
            
            shutdown_response=$(curl -s -w "%{http_code}" -o /dev/null -X DELETE "$INFRA_API_ENDPOINT/$instance_id" \
              -H "Authorization: Bearer $INFRA_API_TOKEN" \
              -H "Content-Type: application/json")

            if [ "$shutdown_response" -eq 200 ] || [ "$shutdown_response" -eq 204 ]; then
              echo "✅ Başarıyla kapatıldı: $instance_id"
            else
              echo "⚠️ Kapatma sırasında hata oluştu (HTTP Status: $shutdown_response): $instance_id"
            fi
          done

          echo "✅ Temizlik ve kapatma döngüsü başarıyla tamamlandı."

      - name: Notify on failure
        if: failure()
        run: echo "Idle cleanup ve gerçek kapatma işlemi başarısız oldu – kontrol et."
