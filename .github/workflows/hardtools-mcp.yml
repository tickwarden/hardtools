# AI-assisted: Bu dosya Claude (Anthropic) tarafından yeniden düzenlendi; auto_renew zinciri ve
# unpublish sertleştirmesi de Claude tarafından eklendi. Teslim yolunun private/public ayrımı
# (public repoda tetikleyenin GitHub SSH key'lerine şifreleme) de Claude tarafından eklendi.
# Merge etmeden önce insan gözden geçirmesi gerekir (Legends11).
#
# Bu workflow hiçbir repo secret'ı veya variable'ı GEREKTİRMEZ.
#  - MCP token'ı her çalıştırmada rastgele üretilir ve log'da maskelenir (::add-mask::).
#  - Tünel: Cloudflare quick tunnel (hesap/token gerekmez).
#  - npm: trusted publishing (OIDC), NPM_TOKEN yok.
#  - Bağlantı bilgisi (endpoint + token) log/özet yerine `hardtools-connect` artifact'ında.
#    age_recipient verilirse age ile şifrelenir (her iki repo tipinde).
#    Boşta private repoda: düz metin (artifact zip'ini indir, connect.txt'yi aç).
#    Boşta public repoda: otomatik age key çifti üretilir; private key
#    `hardtools-age-key` artifact'ında, connect.txt o key ile şifreli.
#
# serve davranışı:
#  - MCP sunucusu çökerse aynı token/host ile yeniden başlatılır (en fazla 5 kez).
#  - Tünel ölürse job kapanır: quick tunnel URL'si değişir, istemci yeniden yapılandırılmalıdır.
#  - GitHub-hosted job'ların 6 saatlik KESİN sınırı vardır. auto_renew=true ise ~5 sa 30 dk'da
#    aynı girdilerle yeni bir serve run'ı tetiklenir; yeni run'ın serve job'ı başlayınca
#    concurrency eskisini iptal eder. Her yenilemede URL + token DEĞİŞİR: yeni run'ın
#    `hardtools-connect` artifact'ından connector'ı güncellemen gerekir.
#  - auto_renew=false ise ~5 sa 45 dk'da temiz çıkılır; elle action=serve ile yeniden başlat.
#  - Zinciri durdurmak için action=unpublish çalıştır (çalışan + kuyruktaki serve run'larını iptal eder).
#  - Private repoda 7/24 çalışma Actions dakika kotasını hızla tüketir (~43.000 dk/ay).
#
# [2026-11-17] ubuntu-latest → ubuntu-24.04 sabitlendi (actions/runner-images#14748:
#   ubuntu-latest 19 Kas 2026'ya kadar 26.04'e geçiyor; sessiz fail riskini önlemek için
#   tüm job'larda image sabitleniyor).
# [2026-11-18] github:kullanici SSH key fallback kaldırıldı.
#   age_recipient boş + private repo → connect.txt düz metin (zip'ten direkt oku).
#   age_recipient boş + public repo → otomatik age key; private key hardtools-age-key artifact'ında.
name: hardtools MCP – Build, Publish & Serve

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Ne yapılsın?'
        type: choice
        options: [build-only, serve, unpublish]
        default: build-only
      age_recipient:
        description: 'serve: age (age1...) veya SSH PUBLIC key. Boşsa: private repoda düz metin, public repoda otomatik key (hardtools-age-key artifact).'
        type: string
        default: ''
      allow_local_tools:
        description: 'serve: HARDTOOLS_HTTP_ALLOW_LOCAL_TOOLS açılsın mı? (riskli)'
        type: boolean
        default: false
      auto_renew:
        description: 'serve: 6 saat dolmadan kendini yeniden başlat (unpublish ile durdurana kadar). Her yenilemede URL+token değişir'
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  MCP_PORT: '8787'

jobs:
  # ──────────────────────────────────────────────
  # 1. Test + Bundle
  # ──────────────────────────────────────────────
  test-and-bundle:
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'unpublish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=1 test/*.test.mjs
      - run: npm run bundle

      - uses: actions/upload-artifact@v7
        with:
          name: hardtools-bundle
          path: |
            bundle/
            package.json
            README.md
            LICENSE
            hardtools.config.example.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. npm publish (sadece v* tag'i) – OIDC trusted publishing
  #    Tek seferlik kurulum npmjs.com'da yapılır (secret değil):
  #    Paket > Settings > Trusted Publisher > GitHub Actions
  #    (repo + bu workflow'un dosya adı)
  # ──────────────────────────────────────────────
  publish-npm:
    needs: test-and-bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'    # trusted publishing için npm >= 11.5.1 gerekir
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Tag ile package.json sürümü eşleşiyor mu?
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) != package.json ($pkg)"
            exit 1
          fi

      - run: npm ci
      - run: npm run bundle
      - run: npm publish --access public

  # ──────────────────────────────────────────────
  # 3. MCP sunucusu + quick tunnel (sadece elle: action = serve)
  #    Endpoint + token `hardtools-connect` artifact'ında (age ile şifreli).
  #    age_recipient verilirse: age1.../SSH public key ile şifrele.
  #    age_recipient boşsa + private repo: connect.txt düz metin (artifact zip → connect.txt).
  #    age_recipient boşsa + public repo: otomatik age key; hardtools-age-key artifact'ı +
  #    age -d -i age-private-key.txt connect.txt
  #    auto_renew=true ise süre dolmadan kendini yeniden tetikler.
  # ──────────────────────────────────────────────
  serve:
    needs: test-and-bundle
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'serve'
    runs-on: ubuntu-24.04
    timeout-minutes: 360          # GitHub-hosted job üst sınırı; temiz çıkış ~345 dk'da (aşağıda)
    concurrency:
      group: hardtools-mcp-serve
      cancel-in-progress: true
    permissions:
      contents: read
      actions: write              # auto_renew: kendini yeniden tetiklemek için
    env:
      # cloudflared 2026.8.1 – linux-amd64 ham binary
      # (sha256 doğrulandı: release asset'inin gerçek özetiyle eşleşiyor)
      CLOUDFLARED_VERSION: '2026.8.1'
      CLOUDFLARED_SHA256: '98d8eadbfdf8c7ec994e08260599c9be991e7833c746f98692b18bdf71c9b9dc'
      AGE_RECIPIENT: ${{ inputs.age_recipient }}
      ALLOW_LOCAL_TOOLS: ${{ inputs.allow_local_tools && '1' || '0' }}
      AUTO_RENEW: ${{ inputs.auto_renew && '1' || '0' }}
      REPO_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: age binary'yi yükle + alıcıyı hazırla
        run: |
          set -euo pipefail
          rec="$RUNNER_TEMP/recipients.txt"
          key_dir="$RUNNER_TEMP/age-key"
          mkdir -p "$key_dir"

          # Modern age binary (apt 1.1.1 yerine – malformed hatasını önler)
          curl -fsSL --retry 3 -o /tmp/age.tgz \
            "https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz"
          tar -xzf /tmp/age.tgz -C /tmp
          cp /tmp/age/age /tmp/age/age-keygen "$RUNNER_TEMP/"
          chmod +x "$RUNNER_TEMP/age" "$RUNNER_TEMP/age-keygen"
          export PATH="$RUNNER_TEMP:$PATH"

          src="${AGE_RECIPIENT:-}"

          if [ -z "$src" ]; then
            if [ "${REPO_PRIVATE:-}" = "true" ]; then
              # Private repo + boş → şifreleme yok, düz metin
              echo "DELIVERY=plain" >> "$GITHUB_ENV"
              echo "AUTO_KEY=0" >> "$GITHUB_ENV"
              echo "RENEW_RECIPIENT=" >> "$GITHUB_ENV"
              exit 0
            else
              # Public repo + boş → otomatik age key üret
              echo "::notice::Public repo; age_recipient verilmedi; otomatik key çifti üretiliyor."
              (
                umask 077
                "$RUNNER_TEMP/age-keygen" -o "$key_dir/age-private-key.txt"
              )
              "$RUNNER_TEMP/age-keygen" -y "$key_dir/age-private-key.txt" > "$rec"
              echo "DELIVERY=age" >> "$GITHUB_ENV"
              echo "AUTO_KEY=1" >> "$GITHUB_ENV"
              echo "RENEW_RECIPIENT=" >> "$GITHUB_ENV"
            fi
          else
            echo "AUTO_KEY=0" >> "$GITHUB_ENV"
            echo "DELIVERY=age" >> "$GITHUB_ENV"
            echo "RENEW_RECIPIENT=$src" >> "$GITHUB_ENV"
            case "$src" in
              age1*)
                printf '%s\n' "$src" | tr -d '\r\t ' | grep -E '^age1[0-9a-z]+$' > "$rec" || {
                  echo "::error::Geçersiz age public key"
                  exit 1
                }
                ;;
              ssh-ed25519*|ssh-rsa*)
                printf '%s\n' "$src" > "$rec"
                ;;
              *)
                echo "::error::Desteklenmeyen age_recipient formatı. age1... veya ssh-ed25519/ssh-rsa ile başlayan SSH public key gir, ya da boş bırak (otomatik key)."
                exit 1
                ;;
            esac
          fi

          # Son doğrulama
          if ! echo "test" | "$RUNNER_TEMP/age" -R "$rec" -a >/dev/null 2>&1; then
            echo "::error::Alıcı dosyası geçersiz (malformed recipient). İçerik:"
            cat -A "$rec" || true
            exit 1
          fi

          echo "Alıcı hazır."

      - name: Otomatik key artifact'ını yükle (boşsa)
        if: env.AUTO_KEY == '1'
        uses: actions/upload-artifact@v7
        with:
          name: hardtools-age-key
          path: ${{ runner.temp }}/age-key/age-private-key.txt
          retention-days: 1
          if-no-files-found: error

      - uses: actions/download-artifact@v7
        with:
          name: hardtools-bundle
          path: artifact

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start tunnel + MCP server (arka planda)
        run: |
          set -euo pipefail

          # --- cloudflared: sabit sürüm + checksum doğrulaması ---
          cf="$RUNNER_TEMP/cloudflared"
          curl -fsSL --retry 3 -o "$cf" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  $cf" | sha256sum -c -
          chmod +x "$cf"

          # --- Tüneli ÖNCE başlat: host adı, sunucuya ALLOWED_HOSTS olarak verilecek ---
          cf_log="$RUNNER_TEMP/cloudflared.log"
          setsid nohup "$cf" tunnel --no-autoupdate --url "http://127.0.0.1:${MCP_PORT}" >"$cf_log" 2>&1 &
          CF_PID=$!
          echo "$CF_PID" > "$RUNNER_TEMP/cf.pid"

          url=""
          for _ in $(seq 1 60); do
            url="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$cf_log" | head -n1 || true)"
            [ -n "$url" ] && break
            kill -0 "$CF_PID" 2>/dev/null || { cat "$cf_log"; echo "::error::cloudflared çöktü"; exit 1; }
            sleep 1
          done
          [ -n "$url" ] || { cat "$cf_log"; echo "::error::Tünel URL'si 60 sn içinde alınamadı"; exit 1; }
          host="${url#https://}"

          # --- Her çalıştırmada rastgele token; log'da maskele ---
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"

          # --- MCP sunucusu: repo yerine boş sandbox, host kısıtlı ---
          sandbox="$RUNNER_TEMP/hardtools-sandbox"
          mkdir -p "$sandbox"

          (
            umask 077
            {
              printf 'export HARDTOOLS_HTTP_TOKEN=%q\n' "$token"
              printf 'export HARDTOOLS_ALLOWED_HOSTS=%q\n' "$host,127.0.0.1:${MCP_PORT},localhost:${MCP_PORT}"
              printf 'export HARDTOOLS_HTTP_ALLOW_LOCAL_TOOLS=%q\n' "$ALLOW_LOCAL_TOOLS"
              printf 'export HARDTOOLS_PROFILE=%q\n' balanced
              printf 'export HARDTOOLS_ROOTS=%q\n' "$sandbox"
              printf 'export HARDTOOLS_INVITE_ORIGIN=%q\n' "$url"
              printf 'unset HARDTOOLS_CONFIG\n'
            } > "$RUNNER_TEMP/node.env"
          )

          cat > "$RUNNER_TEMP/start-node.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          . "$RUNNER_TEMP/node.env"
          cd "$HARDTOOLS_ROOTS"
          setsid nohup node "$GITHUB_WORKSPACE/artifact/bundle/index.js" \
            --http --host 127.0.0.1 --port "$MCP_PORT" --profile "$HARDTOOLS_PROFILE" \
            >>"$RUNNER_TEMP/node.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/node.pid"
          SH
          chmod +x "$RUNNER_TEMP/start-node.sh"

          bash "$RUNNER_TEMP/start-node.sh"
          NODE_PID="$(cat "$RUNNER_TEMP/node.pid")"

          ready=0
          for _ in $(seq 1 30); do
            kill -0 "$NODE_PID" 2>/dev/null || { tail -n 20 "$RUNNER_TEMP/node.log"; echo "::error::MCP sunucusu çöktü"; exit 1; }
            if (exec 3<>"/dev/tcp/127.0.0.1/$MCP_PORT") 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { tail -n 20 "$RUNNER_TEMP/node.log"; echo "::error::Sunucu 30 sn içinde hazır olmadı"; exit 1; }

          # --- Bağlantı bilgisi: artifact dosyası ---
          endpoint="$url/mcp"
          mkdir -p "$RUNNER_TEMP/connect"
          conn="$RUNNER_TEMP/connect/connect.txt"

          invite_url=""
          for _ in $(seq 1 15); do
            invite_url="$(grep -oE "${url}/invite/[A-Za-z0-9._~%=-]+" "$RUNNER_TEMP/node.log" | head -n1 || true)"
            [ -n "$invite_url" ] && break
            sleep 1
          done
          if [ -z "$invite_url" ]; then
            echo "::error::Sunucu invite URL üretemedi. node.log kontrol et."
            tail -n 20 "$RUNNER_TEMP/node.log"
            exit 1
          fi

          plain="$(printf 'A) claude.ai web / Claude app  (Settings > Connectors > Add custom connector)\n   1. Git: %s\n      Bu invite linkini aç (tek seferlik, 24 saat geçerli).\n   2. Sonra connector ekle:\n      URL: %s\n      OAuth client ID/secret bırak boş. Yetkilendirme otomatik tamamlanır.\n\nB) Claude Code / Desktop (header gönderebilir, invite gerekmez)\n   URL: %s\n   Header name: Authorization\n   Header value: Bearer %s\n\nLOCAL_TOOLS: %s\n' \
            "$invite_url" "$endpoint" "$endpoint" "$token" "$ALLOW_LOCAL_TOOLS")"

          if [ "${DELIVERY:-age}" = "plain" ]; then
            printf '%s\n' "$plain" > "$conn"
            echo "### hardtools MCP yayında (düz metin)" >> "$GITHUB_STEP_SUMMARY"
            echo "**hardtools-connect** artifact'ını indir, zip'in içindeki \`connect.txt\`'yi aç." >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$plain" | "$RUNNER_TEMP/age" -R "$RUNNER_TEMP/recipients.txt" -a > "$conn"
            if [ "$AUTO_KEY" = 1 ]; then
              echo "### hardtools MCP yayında (otomatik key)" >> "$GITHUB_STEP_SUMMARY"
              echo "connect.txt şifreli. Aç:" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "age -d -i age-private-key.txt connect.txt" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "Private key **hardtools-age-key** artifact'ında. connect.txt **hardtools-connect** artifact'ında." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### hardtools MCP yayında (sağlanan key)" >> "$GITHUB_STEP_SUMMARY"
              echo "connect.txt şifreli. SSH key: \`age -d -i ~/.ssh/id_ed25519 connect.txt\`; age key: \`age -d -i key.txt connect.txt\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "Local tools: \`$ALLOW_LOCAL_TOOLS\`. Kapatmak için: \`action = unpublish\` ile çalıştır." >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUTO_RENEW" = 1 ]; then
            echo "Otomatik yenileme AÇIK: ~5 sa 30 dk'da yeni bir serve run'ı tetiklenir. Yeni URL+token için o run'ın artifact'larına bak." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Oturum en fazla ~5 sa 45 dk sürer; sonra action = serve ile yeniden başlat." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bağlantı bilgisini artifact olarak yükle
        uses: actions/upload-artifact@v7
        with:
          name: hardtools-connect
          path: ${{ runner.temp }}/connect/connect.txt
          retention-days: 1
          if-no-files-found: error

      - name: Yayında tut (MCP çökerse yeniden başlat, süre dolmadan yenile)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          CF_PID="$(cat "$RUNNER_TEMP/cf.pid")"
          wf="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          start=$(date +%s)
          renew_at=$(( start + 330 * 60 ))
          deadline=$(( start + 345 * 60 ))
          restarts=0; max_restarts=5
          renewed=0; renew_tries=0; last_try=0
          local_bool=$([ "$ALLOW_LOCAL_TOOLS" = 1 ] && echo true || echo false)
          while :; do
            now=$(date +%s)
            if ! kill -0 "$CF_PID" 2>/dev/null; then
              echo "::warning::Tünel sonlandı, job kapanıyor. Yeni adres için action = serve ile yeniden çalıştır."
              break
            fi
            NODE_PID="$(cat "$RUNNER_TEMP/node.pid")"
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              restarts=$((restarts + 1))
              if [ "$restarts" -gt "$max_restarts" ]; then
                echo "::error::MCP sunucusu $max_restarts kez çöktü, vazgeçildi."
                tail -n 20 "$RUNNER_TEMP/node.log"
                exit 1
              fi
              echo "::warning::MCP sunucusu çöktü, aynı token/host ile yeniden başlatılıyor ($restarts/$max_restarts)."
              bash "$RUNNER_TEMP/start-node.sh" || { echo "::error::Yeniden başlatma başarısız"; exit 1; }
              sleep 3
            fi

            # Yenileme: auto_renew=true ise, age_recipient boş olduğunda RENEW_RECIPIENT da boş;
            # yeni run da otomatik key üretir. Elle verildiyse RENEW_RECIPIENT aktarılır.
            if [ "$AUTO_RENEW" = 1 ] && [ "$renewed" = 0 ] && [ "$now" -ge "$renew_at" ] \
               && [ $(( now - last_try )) -ge 60 ] && [ "$renew_tries" -lt 5 ]; then
              renew_tries=$((renew_tries + 1)); last_try=$now
              if gh workflow run "$wf" --ref "$GITHUB_REF_NAME" \
                   -f action=serve -f age_recipient="${RENEW_RECIPIENT:-}" \
                   -f allow_local_tools="$local_bool" -f auto_renew=true; then
                renewed=1
                echo "::notice::Yeni serve run'ı tetiklendi. Yeni URL+token için yeni run'ın artifact'larına bak."
              else
                echo "::warning::Yenileme tetiklenemedi ($renew_tries/5)."
              fi
            fi

            if [ "$now" -ge "$deadline" ]; then
              if [ "$AUTO_RENEW" = 1 ] && [ "$renewed" = 0 ]; then
                echo "::error::Yenileme başarısız; oturum kapanıyor. action = serve ile elle başlat."
              fi
              echo "::notice::GitHub'ın 6 saatlik job sınırına yaklaşıldı; temiz kapanış."
              break
            fi
            sleep 5
          done

  # ──────────────────────────────────────────────
  # 4. Yayından kaldır: çalışan/kuyruktaki serve run'larını iptal et
  #    (auto_renew zincirini keser)
  # ──────────────────────────────────────────────
  unpublish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'unpublish'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel running serve runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wf="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          found=0
          for pass in 1 2; do
            for st in in_progress queued waiting pending; do
              ids="$(gh run list --workflow "$wf" --event workflow_dispatch \
                       --status "$st" --json databaseId --jq '.[].databaseId')"
              for id in $ids; do
                [ "$id" = "$GITHUB_RUN_ID" ] && continue
                gh run cancel "$id" && echo "İptal edildi: run $id ($st)" && found=1
              done
            done
            [ "$pass" = 1 ] && sleep 20
          done
          [ "$found" = 1 ] || echo "Çalışan serve run'ı bulunamadı."
