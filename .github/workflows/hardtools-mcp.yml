# AI-assisted: Bu dosya Claude (Anthropic) tarafından yeniden düzenlendi.
# Merge etmeden önce insan gözden geçirmesi gerekir (Legends11).
#
# Bu workflow hiçbir repo secret'ı veya variable'ı GEREKTİRMEZ.
#  - MCP token'ı her çalıştırmada rastgele üretilir ve log'da maskelenir (::add-mask::).
#  - Tünel: Cloudflare quick tunnel (hesap/token gerekmez).
#  - npm: trusted publishing (OIDC), NPM_TOKEN yok.
#  - Bağlantı bilgisi (endpoint + token) log/özet yerine `hardtools-connect` artifact'ında.
#    Public repoda age ile şifrelenir; private repoda anahtar vermezsen düz yazı dosyadır.
#
# serve davranışı:
#  - MCP sunucusu çökerse aynı token/host ile yeniden başlatılır (en fazla 5 kez).
#  - Tünel ölürse job kapanır: quick tunnel URL'si değişir, istemci yeniden yapılandırılmalıdır.
#  - GitHub-hosted job'ların 6 saatlik KESİN sınırı vardır; bu sınıra ~5 sa 45 dk'da temiz çıkılır.
#    Sonrasında action=serve ile yeniden başlat (yeni URL + yeni token üretilir).
#  - Yeni bir serve çalıştırmak, çalışan oturumu İPTAL eder (concurrency).
name: hardtools MCP – Build, Publish & Serve

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Ne yapılsın?'
        type: choice
        options: [build-only, serve, unpublish]
        default: build-only
      age_recipient:
        description: 'serve: age (age1...) veya SSH PUBLIC key. Public repoda ZORUNLU; token bununla şifrelenir'
        type: string
        default: ''
      allow_local_tools:
        description: 'serve: HARDTOOLS_HTTP_ALLOW_LOCAL_TOOLS açılsın mı? (riskli)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  MCP_PORT: '8787'

jobs:
  # ──────────────────────────────────────────────
  # 1. Test + Bundle
  # ──────────────────────────────────────────────
  test-and-bundle:
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'unpublish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=1 test/*.test.mjs
      - run: npm run bundle

      - uses: actions/upload-artifact@v7
        with:
          name: hardtools-bundle
          path: |
            bundle/
            package.json
            README.md
            LICENSE
            hardtools.config.example.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. npm publish (sadece v* tag'i) – OIDC trusted publishing
  #    Tek seferlik kurulum npmjs.com'da yapılır (secret değil):
  #    Paket > Settings > Trusted Publisher > GitHub Actions
  #    (repo + bu workflow'un dosya adı)
  # ──────────────────────────────────────────────
  publish-npm:
    needs: test-and-bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'    # trusted publishing için npm >= 11.5.1 gerekir
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Tag ile package.json sürümü eşleşiyor mu?
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) != package.json ($pkg)"
            exit 1
          fi

      - run: npm ci
      - run: npm run bundle
      - run: npm publish --access public

  # ──────────────────────────────────────────────
  # 3. MCP sunucusu + quick tunnel (sadece elle: action = serve)
  #    Endpoint + token `hardtools-connect` artifact'ında: age_recipient verilirse
  #    şifreli, verilmezse (sadece private repoda) düz yazı.
  # ──────────────────────────────────────────────
  serve:
    needs: test-and-bundle
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'serve'
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub-hosted job üst sınırı; temiz çıkış ~345 dk'da (aşağıda)
    concurrency:
      group: hardtools-mcp-serve
      cancel-in-progress: true
    env:
      # cloudflared 2026.8.1 – linux-amd64 ham binary
      # (sha256 doğrulandı: release asset'inin gerçek özetiyle eşleşiyor)
      CLOUDFLARED_VERSION: '2026.8.1'
      CLOUDFLARED_SHA256: '98d8eadbfdf8c7ec994e08260599c9be991e7833c746f98692b18bdf71c9b9dc'
      REPO_PRIVATE: ${{ github.event.repository.private }}
      AGE_RECIPIENT: ${{ inputs.age_recipient }}
      ALLOW_LOCAL_TOOLS: ${{ inputs.allow_local_tools && '1' || '0' }}
    steps:
      - name: Token teslim yolunu doğrula
        run: |
          set -euo pipefail
          if [ -z "$AGE_RECIPIENT" ] && [ "$REPO_PRIVATE" != "true" ]; then
            echo "::error::Public repoda token düz yazı yazılamaz. age_recipient (PUBLIC key) ver veya repo'yu private yap."
            exit 1
          fi
          if [ -n "$AGE_RECIPIENT" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq age
            echo test | age -r "$AGE_RECIPIENT" -a >/dev/null \
              || { echo "::error::age_recipient geçersiz (age1... veya ssh PUBLIC key olmalı)"; exit 1; }
          fi

      - uses: actions/download-artifact@v7
        with:
          name: hardtools-bundle
          path: artifact

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start tunnel + MCP server (arka planda)
        run: |
          set -euo pipefail

          # --- cloudflared: sabit sürüm + checksum doğrulaması ---
          cf="$RUNNER_TEMP/cloudflared"
          curl -fsSL --retry 3 -o "$cf" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  $cf" | sha256sum -c -
          chmod +x "$cf"

          # --- Tüneli ÖNCE başlat: host adı, sunucuya ALLOWED_HOSTS olarak verilecek ---
          cf_log="$RUNNER_TEMP/cloudflared.log"
          setsid nohup "$cf" tunnel --no-autoupdate --url "http://127.0.0.1:${MCP_PORT}" >"$cf_log" 2>&1 &
          CF_PID=$!
          echo "$CF_PID" > "$RUNNER_TEMP/cf.pid"

          url=""
          for _ in $(seq 1 60); do
            url="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$cf_log" | head -n1 || true)"
            [ -n "$url" ] && break
            kill -0 "$CF_PID" 2>/dev/null || { cat "$cf_log"; echo "::error::cloudflared çöktü"; exit 1; }
            sleep 1
          done
          [ -n "$url" ] || { cat "$cf_log"; echo "::error::Tünel URL'si 60 sn içinde alınamadı"; exit 1; }
          host="${url#https://}"

          # --- Her çalıştırmada rastgele token; log'da maskele ---
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"

          # --- MCP sunucusu: repo yerine boş sandbox, host kısıtlı ---
          sandbox="$RUNNER_TEMP/hardtools-sandbox"
          mkdir -p "$sandbox"

          # Sunucu ortamı bir dosyada tutulur: çökerse AYNI token/host ile yeniden başlatılabilsin.
          # (runner geçicidir; dosya yalnızca bu kullanıcıya okunabilir)
          # hardtools.config.example.json KULLANILMAZ: içindeki roots bu runner'da yok
          # ve HARDTOOLS_ROOTS'u ezip sunucuyu "root does not exist" ile çökertir.
          (
            umask 077
            {
              printf 'export HARDTOOLS_HTTP_TOKEN=%q\n' "$token"
              # src/index.ts Host başlığını tam eşleştirir (port dahil). Public host + yerel host'lar.
              printf 'export HARDTOOLS_ALLOWED_HOSTS=%q\n' "$host,127.0.0.1:${MCP_PORT},localhost:${MCP_PORT}"
              printf 'export HARDTOOLS_HTTP_ALLOW_LOCAL_TOOLS=%q\n' "$ALLOW_LOCAL_TOOLS"
              printf 'export HARDTOOLS_PROFILE=%q\n' balanced
              printf 'export HARDTOOLS_ROOTS=%q\n' "$sandbox"
              printf 'unset HARDTOOLS_CONFIG\n'
            } > "$RUNNER_TEMP/node.env"
          )

          cat > "$RUNNER_TEMP/start-node.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          . "$RUNNER_TEMP/node.env"
          cd "$HARDTOOLS_ROOTS"
          # Sunucu çıktısı Actions log'una basılmaz (public repoda sızıntı riski); dosyaya eklenir.
          setsid nohup node "$GITHUB_WORKSPACE/artifact/bundle/index.js" \
            --http --host 127.0.0.1 --port "$MCP_PORT" --profile "$HARDTOOLS_PROFILE" \
            >>"$RUNNER_TEMP/node.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/node.pid"
          SH
          chmod +x "$RUNNER_TEMP/start-node.sh"

          bash "$RUNNER_TEMP/start-node.sh"
          NODE_PID="$(cat "$RUNNER_TEMP/node.pid")"

          ready=0
          for _ in $(seq 1 30); do
            kill -0 "$NODE_PID" 2>/dev/null || { tail -n 20 "$RUNNER_TEMP/node.log"; echo "::error::MCP sunucusu çöktü"; exit 1; }
            if (exec 3<>"/dev/tcp/127.0.0.1/$MCP_PORT") 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { tail -n 20 "$RUNNER_TEMP/node.log"; echo "::error::Sunucu 30 sn içinde hazır olmadı"; exit 1; }

          # --- Bağlantı bilgisi: log/özet YERİNE artifact dosyası ---
          endpoint="$url/mcp"
          mkdir -p "$RUNNER_TEMP/connect"
          conn="$RUNNER_TEMP/connect/connect.txt"
          plain="$(printf 'A) claude.ai web / Claude app  (Settings > Connectors > Add custom connector)\n   URL: %s\n   Leave "OAuth client ID/secret" empty. A browser tab opens; paste this access token when asked:\n   %s\n\nB) Fallback if A fails (URL contains the secret, treat it like a password):\n   URL: %s/%s\n\nC) Claude Code / Desktop (can send headers)\n   URL: %s\n   Header name: Authorization\n   Header value: Bearer %s\n\nLOCAL_TOOLS: %s\n' \
            "$endpoint" "$token" "$endpoint" "$token" "$endpoint" "$token" "$ALLOW_LOCAL_TOOLS")"
          if [ -n "$AGE_RECIPIENT" ]; then
            printf '%s\n' "$plain" | age -r "$AGE_RECIPIENT" -a > "$conn"
            echo "### hardtools MCP yayında (şifreli)" >> "$GITHUB_STEP_SUMMARY"
            echo "Bağlantı bilgisi, age ile şifreli \`hardtools-connect\` artifact'ında. Çözmek için \`age -d -i <özel_anahtar> connect.txt\`." >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$plain" > "$conn"
            echo "### hardtools MCP yayında (private repo)" >> "$GITHUB_STEP_SUMMARY"
            echo "Endpoint ve token, run sayfasının altındaki **Artifacts** bölümünde \`hardtools-connect\` içinde (zip, içinde connect.txt)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Local tools: \`$ALLOW_LOCAL_TOOLS\`. Kapatmak için: \`action = unpublish\` ile çalıştır." >> "$GITHUB_STEP_SUMMARY"
          echo "Oturum en fazla ~5 sa 45 dk sürer (GitHub 6 saat sınırı); sonra action = serve ile yeniden başlat." >> "$GITHUB_STEP_SUMMARY"

      - name: Bağlantı bilgisini artifact olarak yükle
        uses: actions/upload-artifact@v7
        with:
          name: hardtools-connect
          path: ${{ runner.temp }}/connect/connect.txt
          retention-days: 1
          if-no-files-found: error

      - name: Yayında tut (MCP çökerse yeniden başlat, tünel ölürse bitir)
        run: |
          set -uo pipefail
          CF_PID="$(cat "$RUNNER_TEMP/cf.pid")"
          deadline=$(( $(date +%s) + 345 * 60 ))   # 6 saatlik sert sınırdan önce temiz çıkış
          restarts=0
          max_restarts=5
          while :; do
            if ! kill -0 "$CF_PID" 2>/dev/null; then
              # Quick tunnel yeniden başlarsa URL değişir; istemci zaten eski adrese bağlı kalamaz.
              echo "::warning::Tünel sonlandı, job kapanıyor. Yeni adres için action = serve ile yeniden çalıştır."
              break
            fi
            NODE_PID="$(cat "$RUNNER_TEMP/node.pid")"
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              restarts=$((restarts + 1))
              if [ "$restarts" -gt "$max_restarts" ]; then
                echo "::error::MCP sunucusu $max_restarts kez çöktü, vazgeçildi."
                tail -n 20 "$RUNNER_TEMP/node.log"
                exit 1
              fi
              echo "::warning::MCP sunucusu çöktü, aynı token/host ile yeniden başlatılıyor ($restarts/$max_restarts)."
              bash "$RUNNER_TEMP/start-node.sh" || { echo "::error::Yeniden başlatma başarısız"; exit 1; }
              sleep 3
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::notice::GitHub'ın 6 saatlik job sınırına yaklaşıldı; temiz kapanış. Devam için action = serve ile yeniden çalıştır."
              break
            fi
            sleep 5
          done

  # ──────────────────────────────────────────────
  # 4. Yayından kaldır: çalışan serve run'ını iptal et
  # ──────────────────────────────────────────────
  unpublish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'unpublish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel running serve runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wf="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          ids="$(gh run list --workflow "$wf" --event workflow_dispatch \
                   --status in_progress --json databaseId --jq '.[].databaseId')"
          found=0
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh run cancel "$id" && echo "İptal edildi: run $id" && found=1
          done
          [ "$found" = 1 ] || echo "Çalışan serve run'ı bulunamadı."
