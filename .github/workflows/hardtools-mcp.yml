# AI yardımıyla düzenlendi; birleştirmeden önce insan incelemesi önerilir.
# serve: hardtools-connect tek bir yerel BAGLAN.html taşır. Run’a ait davet/token
# kartın içinde doğrulanmış şifrelemeyle kapalıdır. Public ve private repoda aynıdır.
# HARDTOOLS_CONNECT_PASSWORD bir Actions secret’tır, dispatch girdisi değildir.
# check-connection: aynı teslim yolunu job sürerken doğrular ve tüneli açık bırakmaz.
#
# serve davranışı:
#  - MCP sunucusu çökerse aynı token/host ile yeniden başlatılır (en fazla 5 kez).
#  - Tünel ölürse job kapanır: quick tunnel URL'si değişir, istemci yeniden yapılandırılmalıdır.
#  - GitHub-hosted job'ların 6 saatlik KESİN sınırı vardır. auto_renew=true ise ~5 sa 30 dk'da
#    aynı girdilerle yeni bir serve run'ı tetiklenir; yeni run'ın serve job'ı başlayınca
#    concurrency eskisini iptal eder. Her yenilemede URL + token DEĞİŞİR: yeni run'ın
#    `hardtools-connect` artifact'ından connector'ı güncellemen gerekir.
#  - auto_renew=false ise ~5 sa 45 dk'da temiz çıkılır; elle action=serve ile yeniden başlat.
#  - Zinciri durdurmak için action=unpublish çalıştır (çalışan + kuyruktaki serve run'larını iptal eder).
#  - Private repoda 7/24 çalışma Actions dakika kotasını hızla tüketir (~43.000 dk/ay).
#
# [2026-11-17] ubuntu-latest → ubuntu-24.04 sabitlendi (actions/runner-images#14748:
#   ubuntu-latest 19 Kas 2026'ya kadar 26.04'e geçiyor; sessiz fail riskini önlemek için
#   tüm job'larda image sabitleniyor).
name: hardtools MCP – Build, Publish & Serve
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'serve' && 'MCP yayını (serve)' ||
       inputs.action == 'check-connection' && 'Kısa bağlantı testi (yayın değildir)' ||
       format('hardtools · {0}', inputs.action)) || '' }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'serve: MCP oturumu aç; check-connection: yalnızca test et ve kapat.'
        type: choice
        options: [serve, check-connection, build-only, unpublish]
        default: serve
      allow_local_tools:
        description: 'serve: ayrı proje alanında yazma ve izole kabuk (command / argv) açılsın mı?'
        type: boolean
        default: false
      workspace_name:
        description: 'Yeni, boş proje klasörünün adı (bir host yolu değil). Yenilemede veriler taşınmaz.'
        type: string
        default: project
      auto_renew:
        description: 'Tek oturum yerine süre dolmadan yeni oturum başlat. Yenilenirse URL ve token değişir.'
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  MCP_PORT: '8787'

jobs:
  # ──────────────────────────────────────────────
  # 1. Test + Bundle
  # ──────────────────────────────────────────────
  test-and-bundle:
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'unpublish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      # CI push'u, henüz hazırlanan manuel bir serve oturumunu iptal etmesin.
      group: test-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.action || 'ci' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # A missing password fails BEFORE entering the serve concurrency group.
      - name: Yayın parolası yapılandırılmış mı?
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'serve' || inputs.action == 'check-connection')
        env:
          CONNECT_PASSWORD: ${{ secrets.HARDTOOLS_CONNECT_PASSWORD }}
        run: node scripts/connection-card.mjs --check-password

      - run: npm ci
      - name: İzole kabuk test bağımlılığı
        run: bash scripts/install-worker.sh
      - run: npm test
        env:
          HT_REQUIRE_WORKER_TEST: '1'
      - name: Dağıtılan bundle ile MCP, çalışma alanı ve OAuth testleri
        run: npm run test:bundle
        env:
          HT_REQUIRE_WORKER_TEST: '1'
      - name: Dağıtılan bundle kaynakla eşleşiyor mu?
        run: git diff --exit-code --stat -- bundle/index.js bundle/search-worker.js bundle/BAGLAN.html

      - name: Yerel HTML okuyucusunu kurulu Chrome ile doğrula
        run: CHROME_BIN="$(command -v google-chrome)" npm run test:reader

      - uses: actions/upload-artifact@v7
        with:
          name: hardtools-bundle
          path: |
            bundle/
            scripts/connection-card.mjs
            scripts/install-worker.sh
            reader/session.mjs
            package.json
            README.md
            LICENSE
            hardtools.config.example.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # 2. npm publish (sadece v* tag'i) – OIDC trusted publishing
  #    Tek seferlik kurulum npmjs.com'da yapılır (secret değil):
  #    Paket > Settings > Trusted Publisher > GitHub Actions
  #    (repo + bu workflow'un dosya adı)
  # ──────────────────────────────────────────────
  publish-npm:
    needs: test-and-bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'    # trusted publishing için npm >= 11.5.1 gerekir
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Tag ile package.json sürümü eşleşiyor mu?
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) != package.json ($pkg)"
            exit 1
          fi

      - run: npm ci
      - run: npm run bundle
      - run: npm publish --access public

  # ──────────────────────────────────────────────
  # 3. MCP sunucusu ve tünel (serve / check-connection). Kısa kontrol ayrı
  #    concurrency grubunu kullanır; mevcut serve oturumunu iptal etmez.
  # ──────────────────────────────────────────────
  serve:
    name: ${{ inputs.action == 'check-connection' && 'check-connection (geçici test)' || 'serve' }}
    needs: test-and-bundle
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'serve' || inputs.action == 'check-connection')
    runs-on: ubuntu-24.04
    timeout-minutes: 360          # GitHub-hosted job üst sınırı; temiz çıkış ~345 dk'da (aşağıda)
    concurrency:
      group: ${{ inputs.action == 'check-connection' && 'hardtools-mcp-check-connection' || 'hardtools-mcp-serve' }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: write              # auto_renew: kendini yeniden tetiklemek için
    env:
      # cloudflared 2026.8.1 – linux-amd64 ham binary
      # (sha256 doğrulandı: release asset'inin gerçek özetiyle eşleşiyor)
      CLOUDFLARED_VERSION: '2026.8.1'
      CLOUDFLARED_SHA256: '98d8eadbfdf8c7ec994e08260599c9be991e7833c746f98692b18bdf71c9b9dc'
      ALLOW_LOCAL_TOOLS: ${{ inputs.action == 'serve' && inputs.allow_local_tools && '1' || '0' }}
      WORKSPACE_NAME: ${{ inputs.workspace_name || 'project' }}
      AUTO_RENEW: ${{ inputs.action == 'serve' && inputs.auto_renew && '1' || '0' }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: hardtools-bundle
          path: artifact

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: İzole çalışma alanını hazırla
        if: inputs.action == 'serve' && inputs.allow_local_tools
        run: bash artifact/scripts/install-worker.sh

      - name: Start tunnel + MCP server (arka planda)
        id: start_mcp
        run: |
          set -euo pipefail
          umask 077

          # A dispatch input names a fresh child of a private directory, never an arbitrary host mount.
          if ! [[ "$WORKSPACE_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,47}$ ]]; then
            echo '::error::workspace_name 1–48 harf, rakam, alt çizgi veya tire olmalı; yol verilmez.'; exit 1
          fi
          sandbox="$(mktemp -d "$RUNNER_TEMP/ht-work.XXXXXXXX")/$WORKSPACE_NAME"
          mkdir -m 700 -- "$sandbox"

          # --- cloudflared: sabit sürüm + checksum doğrulaması ---
          cf="$RUNNER_TEMP/cloudflared"
          curl -fsSL --retry 3 -o "$cf" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  $cf" | sha256sum -c -
          chmod +x "$cf"

          # --- Tüneli ÖNCE başlat: host adı, sunucuya ALLOWED_HOSTS olarak verilecek ---
          cf_log="$RUNNER_TEMP/cloudflared.log"
          setsid nohup "$cf" tunnel --no-autoupdate --url "http://127.0.0.1:${MCP_PORT}" >"$cf_log" 2>&1 &
          CF_PID=$!
          echo "$CF_PID" > "$RUNNER_TEMP/cf.pid"

          url=""
          for _ in $(seq 1 60); do
            url="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$cf_log" | head -n1 || true)"
            [ -n "$url" ] && break
            kill -0 "$CF_PID" 2>/dev/null || { cat "$cf_log"; echo "::error::cloudflared çöktü"; exit 1; }
            sleep 1
          done
          [ -n "$url" ] || { cat "$cf_log"; echo "::error::Tünel URL'si 60 sn içinde alınamadı"; exit 1; }
          host="${url#https://}"

          # --- Her çalıştırmada rastgele token; log'da maskele ---
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"

          # --- MCP sunucusu: repo yerine boş sandbox, host kısıtlı ---

          (
            umask 077
            {
              printf 'export HARDTOOLS_HTTP_TOKEN=%q\n' "$token"
              printf 'export HARDTOOLS_ALLOWED_HOSTS=%q\n' "$host,127.0.0.1:${MCP_PORT},localhost:${MCP_PORT}"
              printf 'export HARDTOOLS_HTTP_ALLOW_LOCAL_TOOLS=%q\n' "$ALLOW_LOCAL_TOOLS"
              printf 'export HARDTOOLS_PROFILE=%q\n' balanced
              printf 'export HARDTOOLS_ROOTS=%q\n' "$sandbox"
              printf 'export HARDTOOLS_INVITE_ORIGIN=%q\n' "$url"
              printf 'unset HARDTOOLS_CONFIG\n'
            } > "$RUNNER_TEMP/node.env"
          )

          cat > "$RUNNER_TEMP/start-node.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          . "$RUNNER_TEMP/node.env"
          cd "$HARDTOOLS_ROOTS"
          setsid nohup node "$GITHUB_WORKSPACE/artifact/bundle/index.js" \
            --http --host 127.0.0.1 --port "$MCP_PORT" --profile "$HARDTOOLS_PROFILE" \
            >>"$RUNNER_TEMP/node.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/node.pid"
          SH
          chmod +x "$RUNNER_TEMP/start-node.sh"

          bash "$RUNNER_TEMP/start-node.sh"
          NODE_PID="$(cat "$RUNNER_TEMP/node.pid")"

          ready=0
          for _ in $(seq 1 30); do
            kill -0 "$NODE_PID" 2>/dev/null || { echo "::error::MCP sunucusu çöktü"; exit 1; }
            if (exec 3<>"/dev/tcp/127.0.0.1/$MCP_PORT") 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "::error::Sunucu 30 sn içinde hazır olmadı"; exit 1; }

          # Yalnızca bu herkese açık adres step output olur.
          printf 'endpoint=%s/mcp\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Tek dosyalık özel bağlantı kartını oluştur
        env:
          CONNECT_PASSWORD: ${{ secrets.HARDTOOLS_CONNECT_PASSWORD }}
          ENDPOINT: ${{ steps.start_mcp.outputs.endpoint }}
          RUN_MODE: ${{ inputs.action }}
        run: |
          set -euo pipefail
          umask 077
          # The runner-created mode-0600 env file also supports later node restarts.
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/node.env"
          url="${ENDPOINT%/mcp}"
          invite_url=""
          for _ in $(seq 1 15); do
            invite_url="$(grep -oE "${url}/invite/[A-Za-z0-9._~%=-]+" "$RUNNER_TEMP/node.log" | head -n1 || true)"
            [ -n "$invite_url" ] && break
            sleep 1
          done
          if [ -z "$invite_url" ]; then
            echo "::error::Sunucu beklenen tünel adresi için davet üretmedi. Özel bağlantılar içerebilen node.log yayımlanmadı."
            exit 1
          fi

          printf '::add-mask::%s\n' "${invite_url##*/}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          mkdir -p "$RUNNER_TEMP/connect"
          printf '%s\n%s\n' "$invite_url" "${HARDTOOLS_HTTP_TOKEN:?}" | \
            node "$GITHUB_WORKSPACE/artifact/scripts/connection-card.mjs" \
            "$RUNNER_TEMP/connect/BAGLAN.html" "$ENDPOINT" "$run_url" "$GITHUB_RUN_NUMBER" "$RUN_MODE"
          test -s "$RUNNER_TEMP/connect/BAGLAN.html"

      - name: Bağlantı bilgisini artifact olarak yükle
        id: connect_artifact
        uses: actions/upload-artifact@v7
        with:
          name: hardtools-connect
          # Sadece bu dosya: özel anahtar, parola, log ve düz metin yok.
          path: ${{ runner.temp }}/connect/BAGLAN.html
          retention-days: 1
          if-no-files-found: error

      - name: ${{ inputs.action == 'check-connection' && 'Test adresi (kontrolden sonra kapanır)' || 'Bağlantı hazır (canlı log)' }}
        env:
          RUN_MODE: ${{ inputs.action }}
          ENDPOINT: ${{ steps.start_mcp.outputs.endpoint }}
          ARTIFACT_URL: ${{ steps.connect_artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          : "${ENDPOINT:?MCP endpoint boş}" "${ARTIFACT_URL:?Artifact bağlantısı boş}"
          if [[ "$RUN_MODE" == check-connection ]]; then
            title='Kısa bağlantı testi — yayın değildir'
            help="Bu test adresini Claude'a ekleme. Kontrol bitince kapanır. Bağlanmak için yeni bir Run workflow aç ve serve seç; Re-run jobs testi tekrarlar."
          else
            title='MCP yayını'
            help='hardtools-connect ZIP içindeki BAGLAN.html dosyasını bilgisayarında aç ve bağlantı parolanı gir. Başka dosya gerekmez.'
          fi
          printf '::notice title=%s::%s\n' "$title" "$help"
          printf '::notice title=MCP endpoint::%s\n' "$ENDPOINT"
          printf '::notice title=hardtools-connect::%s\n' "$ARTIFACT_URL"

      - name: Kontrol — artifact job sürerken indirilebiliyor mu?
        if: inputs.action == 'check-connection'
        uses: actions/download-artifact@v7
        with:
          name: hardtools-connect
          path: ${{ runner.temp }}/check-connect

      - name: Kontrol — dosya aynı mı ve tünel doğru MCP adresini bildiriyor mu?
        if: inputs.action == 'check-connection'
        env:
          ENDPOINT: ${{ steps.start_mcp.outputs.endpoint }}
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/check-connect" -mindepth 1 -printf '%P\n')" = 'BAGLAN.html'
          cmp -s "$RUNNER_TEMP/connect/BAGLAN.html" "$RUNNER_TEMP/check-connect/BAGLAN.html" || {
            echo '::error::İndirilen bağlantı kartı yüklenenle aynı değil.'; exit 1;
          }
          node "$GITHUB_WORKSPACE/artifact/scripts/connection-card.mjs" --verify-check \
            "$RUNNER_TEMP/check-connect/BAGLAN.html" "$ENDPOINT" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER"
          # Daveti tüketme; kimlik bilgisi göndermeyen OAuth discovery isteği yeterli.
          for _ in {1..15}; do
            if curl -fsS --connect-timeout 3 --max-time 6 \
                "${ENDPOINT%/mcp}/.well-known/oauth-protected-resource" \
                | jq -e --arg ep "$ENDPOINT" '.resource == $ep' >/dev/null; then
              echo 'Job devam ederken artifact indirildi ve canlı MCP adresi doğrulandı.'
              exit 0
            fi
            sleep 2
          done
          echo '::error::Tünelden beklenen MCP resource adresi alınamadı.'; exit 1

      - name: Yayında tut (MCP çökerse yeniden başlat, süre dolmadan yenile)
        if: inputs.action == 'serve'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          CF_PID="$(cat "$RUNNER_TEMP/cf.pid")"
          wf="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          start=$(date +%s)
          renew_at=$(( start + 330 * 60 ))
          deadline=$(( start + 345 * 60 ))
          restarts=0; max_restarts=5
          renewed=0; renew_tries=0; last_try=0
          local_bool=$([ "$ALLOW_LOCAL_TOOLS" = 1 ] && echo true || echo false)
          while :; do
            now=$(date +%s)
            if ! kill -0 "$CF_PID" 2>/dev/null; then
              echo "::error::Tünel beklenmedik biçimde kapandı; bu MCP adresi artık geçerli değil. Yeni bir serve oturumu başlat."
              exit 1
            fi
            NODE_PID="$(cat "$RUNNER_TEMP/node.pid")"
            if ! kill -0 "$NODE_PID" 2>/dev/null; then
              restarts=$((restarts + 1))
              if [ "$restarts" -gt "$max_restarts" ]; then
                echo "::error::MCP sunucusu $max_restarts kez çöktü, vazgeçildi."
                exit 1
              fi
              echo "::warning::MCP sunucusu çöktü, aynı token/host ile yeniden başlatılıyor ($restarts/$max_restarts)."
              bash "$RUNNER_TEMP/start-node.sh" || { echo "::error::Yeniden başlatma başarısız"; exit 1; }
              sleep 3
            fi

            # Yeni run kendi kartını repo secret’ıyla kapatır; parolayı dispatch girdisine taşıma.
            if [ "$AUTO_RENEW" = 1 ] && [ "$renewed" = 0 ] && [ "$now" -ge "$renew_at" ] \
               && [ $(( now - last_try )) -ge 60 ] && [ "$renew_tries" -lt 5 ]; then
              renew_tries=$((renew_tries + 1)); last_try=$now
              if gh workflow run "$wf" --ref "$GITHUB_REF_NAME" \
                   -f action=serve \
                   -f allow_local_tools="$local_bool" -f workspace_name="$WORKSPACE_NAME" -f auto_renew=true; then
                renewed=1
                echo "::notice::Yeni serve run'ı tetiklendi. Yeni URL+token için yeni run'ın artifact'larına bak."
              else
                echo "::warning::Yenileme tetiklenemedi ($renew_tries/5)."
              fi
            fi

            if [ "$now" -ge "$deadline" ]; then
              if [ "$AUTO_RENEW" = 1 ] && [ "$renewed" = 0 ]; then
                echo "::error::Yenileme başarısız; oturum kapanıyor. action = serve ile elle başlat."
              fi
              echo "::notice::GitHub'ın 6 saatlik job sınırına yaklaşıldı; temiz kapanış."
              break
            fi
            sleep 5
          done

  # ──────────────────────────────────────────────
  # 4. Yayından kaldır: çalışan/kuyruktaki serve run'larını iptal et
  #    (auto_renew zincirini keser)
  # ──────────────────────────────────────────────
  unpublish:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'unpublish'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel running serve runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wf="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          found=0
          for pass in 1 2; do
            for st in in_progress queued waiting pending; do
              ids="$(gh run list --workflow "$wf" --event workflow_dispatch \
                       --status "$st" --json databaseId --jq '.[].databaseId')"
              for id in $ids; do
                [ "$id" = "$GITHUB_RUN_ID" ] && continue
                gh run cancel "$id" && echo "İptal edildi: run $id ($st)" && found=1
              done
            done
            [ "$pass" = 1 ] && sleep 20
          done
          [ "$found" = 1 ] || echo "Çalışan serve run'ı bulunamadı."
